<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>배달세일 - 오늘의 배달 앱 통합 할인 나침반</title>
    <!-- 디자인을 예쁘게 만들어주는 필수 부품 -->
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">

    <!-- 상단 바 -->
    <header class="bg-white shadow-sm sticky top-0 z-50 px-4 py-3 flex justify-between items-center max-w-md mx-auto">
        <h1 class="text-xl font-black text-orange-500 flex items-center gap-1">🧭 배달세일</h1>
        <div id="location" class="text-xs bg-orange-50 text-orange-600 px-3 py-1.5 rounded-full font-bold">📍 논산시 내동 주변</div>
    </header>

    <!-- 메인 화면 박스 -->
    <main class="max-w-md mx-auto p-4 space-y-5 pb-24">
        
        <!-- 상단 광고판 -->
        <div class="bg-gray-100 p-4 rounded-2xl flex items-center justify-between text-xs text-gray-400 border border-dashed border-gray-300">
            <span class="font-medium">📢 추천 배너 광고 영역</span>
            <button class="bg-white text-gray-700 font-bold px-3 py-1.5 rounded-xl shadow-sm border border-gray-200">홈 화면에 추가</button>
        </div>

        <!-- 대제목 -->
        <div class="space-y-1">
            <h2 class="text-lg font-extrabold text-gray-800">오늘만 역대급 할인 TOP 3</h2>
            <p class="text-xs text-gray-400">※ 실시간 배달비 무료 및 매장 혜택 자동 반영</p>
        </div>

        <!-- 🌟 진짜 할인 카드가 꽂히는 공간 -->
        <div id="discount-container" class="space-y-4">
            <p class="text-center text-gray-400 py-10 text-sm animate-pulse">실시간 동네 배달 할인을 정제하는 중입니다...</p>
        </div>
    </main>

    <!-- 데이터 연결 마법 도구 -->
    <script>
        fetch('discounts.json')
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('discount-container');
                container.innerHTML = ''; // 기존의 깨진 글자들 청소

                data.forEach((item) => {
                    const card = document.createElement('div');
                    card.className = "bg-white p-5 rounded-2xl shadow-sm border border-gray-100 flex justify-between items-center";
                    
                    // 배달앱 브랜드별 이쁜 색상 라벨 지정
                    let appBadge = item.platform || "배달앱";
                    let badgeClass = "bg-orange-100 text-orange-600";
                    if(appBadge.includes("쿠팡")) badgeClass = "bg-sky-100 text-sky-600";
                    if(appBadge.includes("요기요")) badgeClass = "bg-pink-100 text-pink-600";

                    // 변수 이름 매칭 오류(undefined) 완벽 보완 작업
                    let foodCategory = item.category || "추천 맛집";
                    let shopName = item.brand || "동네 인기 매장";
                    let discountInfo = item.discount || "특별 할인 중";
                    let limitCondition = item.condition || "주문 시 확인";
                    let appLink = item.link || "https://baemin.com";

                    card.innerHTML = `
                        <div class="space-y-1.5 flex-1 pr-2">
                            <div class="flex items-center gap-2">
                                <span class="text-[11px] font-extrabold px-2 py-0.5 rounded-lg ${badgeClass}">${appBadge}</span>
                                <span class="text-[11px] text-gray-400 font-medium">#${foodCategory}</span>
                            </div>
                            <h3 class="font-extrabold text-base text-gray-800 leading-tight">${shopName}</h3>
                            <p class="text-xl font-black text-red-500">${discountInfo}</p>
                            <p class="text-[11px] text-gray-400 font-medium">${limitCondition}</p>
                        </div>
                        <div class="flex flex-col items-end justify-between h-20 min-w-[75px]">
                            <button onclick="alert('⭐️ 관심 음식 알림이 등록되었습니다! 해당 매장 세일 시 즉시 알림이 울립니다.')" class="text-xs text-gray-400 hover:text-orange-500 font-medium flex items-center gap-0.5">🔔 알림</button>
                            <a href="${appLink}" target="_blank" class="bg-orange-500 hover:bg-orange-600 text-white text-xs font-extrabold px-3 py-2 rounded-xl shadow-sm transition-all text-center w-full">앱으로 이동</a>
                        </div>
                    `;
                    container.appendChild(card);
                });
            })
            .catch(error => {
                console.error("오류 발생:", error);
                document.getElementById('discount-container').innerHTML = '<p class="text-center text-gray-400 py-10 text-sm">최신 데이터를 불러오는 중입니다. 잠시 후 새로고침 해주세요.</p>';
            });
    </script>
</body>
</html>
