<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘의 배달 할인 - 배달세일</title>
    <!-- 디자인 컴포넌트를 기획안과 똑같이 만들어주는 부품 -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900">

    <!-- 최상단 버튼 바 -->
    <div class="max-w-md mx-auto px-4 pt-3 flex justify-between gap-3">
        <button class="flex-1 bg-blue-50 text-blue-600 font-bold text-xs py-2.5 rounded-xl border border-blue-100">📱 홈화면에 추가</button>
        <button class="flex-1 bg-gray-100 text-gray-600 font-bold text-xs py-2.5 rounded-xl">🔗 공유하기</button>
    </div>

    <!-- 메인 기획 박스 -->
    <main class="max-w-md mx-auto p-4 space-y-4 pb-24">
        
        <!-- 타이틀 세션 -->
        <div class="flex justify-between items-end">
            <div>
                <span class="text-xs text-green-600 font-bold bg-green-50 px-2 py-0.5 rounded-md border border-green-100">🧭 실시간 배달 할인 나침반 <span class="animate-pulse text-red-500">LIVE</span></span>
                <h1 class="text-2xl font-black mt-1">오늘의 배달 할인</h1>
            </div>
            <div class="text-right text-xs text-gray-400 font-medium">오늘 기준<br><span class="font-bold text-gray-700 text-sm">7월 25일</span></div>
        </div>

        <!-- 주소 설정 지역 바 -->
        <div class="bg-blue-50 border border-blue-100 rounded-2xl p-3 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <span class="text-xl">🔵</span>
                <div>
                    <p class="text-[10px] text-blue-500 font-bold">📍 내 주변 배달 설정 지역</p>
                    <p class="text-sm font-black text-blue-900">논산 내동</p>
                </div>
            </div>
            <button class="bg-white text-blue-600 font-bold text-xs px-3 py-1.5 rounded-xl shadow-sm border border-blue-100">주소 변경</button>
        </div>

        <!-- 브랜드 검색창 -->
        <div class="relative">
            <input type="text" placeholder="🔍 브랜드명, 카테고리 (예: BBQ, 버거, 치킨)" class="w-full bg-gray-100 text-sm p-3.5 rounded-2xl border-none focus:outline-none focus:ring-2 focus:ring-orange-500 font-medium placeholder-gray-400">
        </div>

        <!-- 플랫폼 필터 탭 -->
        <div class="flex gap-2 overflow-x-auto pb-1 text-xs font-bold">
            <button class="bg-gray-900 text-white px-4 py-2 rounded-xl flex items-center gap-1.5 shadow-md">전체 <span class="bg-gray-700 text-[10px] px-1.5 py-0.5 rounded-md" id="total-count">6</span></button>
            <button class="bg-gray-100 text-gray-500 px-4 py-2 rounded-xl">배민 <span class="text-gray-400 font-medium">2</span></button>
            <button class="bg-gray-100 text-gray-500 px-4 py-2 rounded-xl">쿠팡이츠 <span class="text-gray-400 font-medium">2</span></button>
            <button class="bg-gray-100 text-gray-500 px-4 py-2 rounded-xl">요기요 <span class="text-gray-400 font-medium">1</span></button>
            <button class="bg-gray-100 text-gray-500 px-4 py-2 rounded-xl">땡겨요</button>
        </div>

        <!-- 음식 카테고리 탭 -->
        <div class="flex gap-2 overflow-x-auto text-xs font-semibold text-gray-500 border-b border-gray-100 pb-2">
            <button class="text-blue-600 border-b-2 border-blue-600 pb-1 px-1">전체</button>
            <button class="pb-1 px-1">치킨</button>
            <button class="pb-1 px-1">피자</button>
            <button class="pb-1 px-1">버거</button>
            <button class="pb-1 px-1">분식/야식</button>
            <button class="pb-1 px-1">카페/디저트</button>
            <button class="pb-1 px-1">한식/기타</button>
        </div>

        <!-- 구글 광고 배너 영역 -->
        <div class="bg-gray-50 border border-dashed border-gray-200 rounded-2xl p-4 text-center space-y-1">
            <p class="text-xs font-bold text-red-400 flex items-center justify-center gap-1">📢 ADVERTISE BANNER AREA (상단 광고 배너)</p>
            <p class="text-[10px] text-gray-400">구글 애드센스 / 카카오 애드핏 디스플레이 광고 코드 영역</p>
        </div>

        <!-- 총 할인 개수 안내 -->
        <p class="text-xs font-extrabold text-gray-700">총 <span class="text-orange-500" id="sub-total-count">6</span>개의 할인</p>

        <!-- 🔥 [기획안 핵심] 오늘의 역대급 할인 TOP 3 노란색 박스 -->
        <div class="bg-amber-400 rounded-3xl p-4 space-y-3 shadow-md">
            <div class="flex justify-between items-center text-white">
                <h3 class="text-sm font-black flex items-center gap-1">🔥 오늘만 역대급 할인 TOP 3!</h3>
                <span class="text-[10px] font-bold bg-amber-500 px-2 py-0.5 rounded-full">AI 랭킹 자동 선정</span>
            </div>
            <!-- TOP 3 리스트가 주입되는 공간 -->
            <div id="top3-container" class="space-y-2"></div>
        </div>

        <!-- 🌟 일반 실시간 할인 카드 리스트가 주입되는 공간 -->
        <div id="discount-list-container" class="space-y-4"></div>

    </main>

    <!-- 실시간 톱니바퀴 연동 도구 -->
    <script>
        fetch('discounts.json')
            .then(response => response.json())
            .then(data => {
                // 상단 카운트 개수 자동 반영
                document.getElementById('total-count').innerText = data.length;
                document.getElementById('sub-total-count').innerText = data.length;

                const top3Container = document.getElementById('top3-container');
                const listContainer = document.getElementById('discount-list-container');
                
                top3Container.innerHTML = '';
                listContainer.innerHTML = '';

                // 1. TOP 3 박스 안의 하얀 카드 그리기 (최대 3개)
                const top3Data = data.slice(0, 3);
                top3Data.forEach((item, index) => {
                    const topCard = document.createElement('div');
                    topCard.className = "bg-white p-3 rounded-2xl flex justify-between items-center shadow-sm border border-amber-100";
                    topCard.innerHTML = `
                        <div class="flex items-center gap-2">
                            <span class="bg-orange-500 text-white font-black text-xs w-5 h-5 rounded-full flex items-center justify-center">${index + 1}</span>
                            <div>
                                <h4 class="font-black text-sm text-gray-800">${item.brand}</h4>
                                <p class="text-xs font-black text-orange-500">${item.discount}</p>
                            </div>
                        </div>
                        <a href="${item.link}" target="_blank" class="bg-orange-50 text-orange-600 font-extrabold text-xs px-3 py-2 rounded-xl border border-orange-100 flex items-center gap-0.5">앱으로 이동 ➔</a>
                    `;
                    top3Container.appendChild(topCard);
                });

                // 2. 아랫쪽 일반 배달앱 카드뉴스 리스트 그리기
                data.forEach((item) => {
                    const listCard = document.createElement('div');
                    listCard.className = "bg-white p-4 rounded-2xl shadow-sm border border-gray-100 space-y-3";
                    
                    let badgeClass = "bg-green-100 text-green-700 border-green-200";
                    if(item.platform.includes("쿠팡")) badgeClass = "bg-blue-100 text-blue-700 border-blue-200";
                    if(item.platform.includes("요기요")) badgeClass = "bg-pink-100 text-pink-700 border-pink-200";
                    if(item.platform.includes("땡겨요")) badgeClass = "bg-indigo-100 text-indigo-700 border-indigo-200";

                    let conditionInfo = item.condition || "18,000원 이상";
                    let foodCategory = item.category || "치킨";

                    listCard.innerHTML = `
                        <div class="flex justify-between items-start">
                            <div class="space-y-1.5">
                                <div class="flex items-center gap-1.5 text-[10px] font-bold">
                                    <span class="px-2 py-0.5 rounded-lg border ${badgeClass}">${item.platform}</span>
                                    <span class="text-gray-400">#${foodCategory}</span>
                                    <span class="text-gray-400 font-medium">${conditionInfo}</span>
                                </div>
                                <h3 class="text-xl font-black text-gray-800">${item.brand} <span class="text-[10px] text-gray-300 font-normal border px-1 rounded ml-1">${item.brand.substring(0,2)}</span></h3>
                                <p class="text-2xl font-black text-red-500 leading-none">${item.discount}</p>
                            </div>
                            <a href="${item.link}" target="_blank" class="bg-cyan-500 hover:bg-cyan-600 text-white font-black text-xs px-4 py-3 rounded-2xl shadow-sm transition-all h-11 flex items-center justify-center">앱으로 이동 ➔</a>
                        </div>
                        
                        <!-- 추가 혜택 및 수수료 안내 영역 -->
                        <div class="space-y-1.5 pt-1 border-t border-gray-50">
                            <div class="bg-orange-50 border border-orange-100 rounded-xl p-2 flex items-center gap-1.5 text-xs text-orange-700 font-bold">
                                <span>🔥 혜택 더하기:</span>
                                <span class="font-extrabold">신한카드 2,000원 추가 할인</span>
                            </div>
                            <div class="bg-green-50 border border-green-100 rounded-xl p-2 flex items-center gap-1.5 text-xs text-green-700 font-bold">
                                <span>✓ 오늘 하루만 유효</span>
                                <span class="text-gray-400 font-medium">(${conditionInfo})</span>
                            </div>
                            <p class="text-[9px] text-gray-400 leading-tight">※ 이 링크를 통해 주문 시 파트너스 활동의 일환으로 소정의 수수료가 창작자에게 지급됩니다.</p>
                        </div>
                    `;
                    listContainer.appendChild(listCard);
                });
