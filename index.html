<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>배달세일 - 오늘의 배달 앱 통합 할인 나침반</title>
    <!-- [🌟 디자인 완벽 해결] 링크 끊김 현상 없는 가장 안전한 스타일 부품으로 교체했습니다 -->
    <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body class="bg-gray-50 text-gray-900" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">

    <!-- 상단 바 -->
    <div class="bg-white shadow-sm sticky top-0 z-50 px-4 py-3 flex justify-between items-center max-w-md mx-auto border-b border-gray-100">
        <h1 class="text-xl font-extrabold text-orange-500">🧭 배달세일</h1>
        <div class="text-xs bg-orange-50 text-orange-600 px-3 py-1.5 rounded-full font-bold">📍 논산시 내동 주변</div>
    </div>

    <!-- 메인 화면 박스 -->
    <div class="max-w-md mx-auto p-4 space-y-5 pb-24">
        
        <!-- 상단 광고판 -->
        <div class="bg-gray-100 p-4 rounded-2xl flex items-center justify-between text-xs text-gray-400 border border-dashed border-gray-300">
            <span class="font-medium">📢 추천 배너 광고 영역</span>
            <button class="bg-white text-gray-700 font-bold px-3 py-1.5 rounded-xl shadow-sm border border-gray-200">홈 화면에 추가</button>
        </div>

        <!-- 대제목 -->
        <div class="space-y-1">
            <h2 class="text-lg font-bold text-gray-800">오늘만 역대급 할인 TOP 3</h2>
            <p class="text-xs text-gray-400">※ 실시간 배달비 무료 및 매장 혜택 자동 반영</p>
        </div>

        <!-- 🌟 진짜 할인 카드가 꽂히는 공간 -->
        <div id="discount-container" class="space-y-4">
            <p class="text-center text-gray-400 py-10 text-sm">실시간 동네 배달 할인을 정제하는 중입니다...</p>
        </div>
    </div>

    <!-- 데이터 연결 마법 도구 -->
    <script>
        fetch('discounts.json')
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('discount-container');
                container.innerHTML = ''; // 기존 글자 청소

                data.forEach((item) => {
                    const card = document.createElement('div');
                    // 디자인 레이아웃 설정
                    card.style.display = "flex";
                    card.style.justifyContent = "between";
                    card.style.alignItems = "center";
                    card.style.backgroundColor = "white";
                    card.style.padding = "20px";
                    card.style.borderRadius = "16px";
                    card.style.border = "1px solid #f3f4f6";
                    card.style.marginBottom = "16px";
                    card.style.boxShadow = "0 1px 3px 0 rgba(0, 0, 0, 0.1)";
                    
                    let appBadge = item.platform || "배달앱";
                    let badgeClass = "background-color: #ffedd5; color: #ea580c;"; // 주황
                    if(appBadge.includes("쿠팡")) badgeClass = "background-color: #e0f2fe; color: #0284c7;"; // 파랑
                    if(appBadge.includes("요기요")) badgeClass = "background-color: #fce7f3; color: #db2777;"; // 핑크

                    let foodCategory = item.category || "추천 맛집";
                    let shopName = item.brand || "동네 인기 매장";
                    let discountInfo = item.discount || "특별 할인 중";
                    let limitCondition = item.condition || "주문 시 확인";
                    let appLink = item.link || "https://baemin.com";

                    card.innerHTML = `
                        <div style="flex: 1; padding-right: 8px;">
                            <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 4px;">
                                <span style="font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 6px; ${badgeClass}">${appBadge}</span>
                                <span style="font-size: 11px; color: #9ca3af; font-weight: 500;">#${foodCategory}</span>
                            </div>
                            <h3 style="font-weight: 800; font-size: 16px; color: #1f2937; margin-bottom: 2px;">${shopName}</h3>
                            <p style="font-size: 20px; font-weight: 900; color: #ef4444; margin-bottom: 2px;">${discountInfo}</p>
                            <p style="font-size: 11px; color: #9ca3af; font-weight: 500;">${limitCondition}</p>
                        </div>
                        <div style="display: flex; flex-direction: column; justify-content: space-between; align-items: flex-end; height: 80px; min-w: 80px;">
                            <button onclick="alert('⭐️ 관심 음식 알림이 등록되었습니다!')" style="font-size: 12px; color: #9ca3af; font-weight: 500; background: none; border: none; cursor: pointer;">🔔 알림</button>
                            <a href="${appLink}" target="_blank" style="background-color: #f97316; color: white; font-size: 12px; font-weight: 800; padding: 8px 12px; border-radius: 12px; text-decoration: none; text-align: center; display: inline-block;">앱으로 이동</a>
                        </div>
                    `;
                    container.appendChild(card);
                });
            })
            .catch(error => {
                console.error("오류 발생:", error);
                document.getElementById('discount-container').innerHTML = '<p class="text-center text-gray-400 py-10 text-sm">최신 데이터를 불러오는 중입니다.</p>';
            });
    </script>
</body>
</html>
