name: Delivery Discount & Marketing Blog AI Auto Update

on:
  schedule:
    # 대한민국 시간 기준 매일 [09:30, 11:15, 17:15, 21:30] 작동 (세계표준시 기준 세팅)
    - cron: '30 0 * * *'
    - cron: '15 2 * * *'
    - cron: '15 8 * * *'
    - cron: '30 12 * * *'
  workflow_dispatch: # 지금처럼 수동으로 버튼 눌러서 깨우는 기능

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 깃허브에 파일을 쓸 수 있는 권한 명시

    steps:
    - name: 소스코드 가져오기
      uses: actions/checkout@v3

    - name: 파이썬 컴퓨터 준비하기
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    # [🌟 에러 해결 핵심] 구글 AI를 작동시킬 필수 부품들을 가상 컴퓨터에 무료 설치하는 단계입니다.
    - name: 구글 AI 필수 부품 설치하기
      run: |
        pip install --upgrade pip
        pip install google-generativeai

    - name: AI 배달 할인 크롤링 엔진 실행하기
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: python update_discounts.py
