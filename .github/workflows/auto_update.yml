name: Delivery Discount & Marketing Blog AI Auto Update

on:
  schedule:
    # 한국시간 09:30 (UTC 00:30)
    - cron: '30 0 * * *'
    # 한국시간 11:15 (UTC 02:15)
    - cron: '15 2 * * *'
    # 한국시간 17:15 (UTC 08:15)
    - cron: '15 8 * * *'
    # 한국시간 21:30 (UTC 12:30)
    - cron: '30 12 * * *'
  workflow_dispatch: # 깃허브 웹에서 수동으로도 즉시 실행할 수 있게 설정

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 코드 불러오기
        uses: actions/checkout@v3

      - name: 파이썬 실행 환경 구축
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 필수 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 google-genai

      - name: 배달 할인 데이터 정제 & 푸시 알림 평가 & 블로그 자동 작성 파이썬 실행
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VERCEL_SITE_URL: ${{ secrets.VERCEL_SITE_URL }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          NAVER_BLOG_ID: ${{ secrets.NAVER_BLOG_ID }}
          COUPANG_EATS_AFFILIATE_URL: ${{ secrets.COUPANG_EATS_AFFILIATE_URL }}
          BAEMIN_AFFILIATE_URL: ${{ secrets.BAEMIN_AFFILIATE_URL }}
          YOGIYO_AFFILIATE_URL: ${{ secrets.YOGIYO_AFFILIATE_URL }}
        run: |
          python update_discounts.py

      - name: 변경된 데이터 및 블로그 원고 자동 깃허브 커밋 & 푸시
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/discounts.json public/daily_blog_post.txt public/notifications_payload.json
          git status
          git commit -m "auto: 배달 할인, 알림 조건 & 마케팅 블로그 글 AI 자동 갱신 [$(date +'%Y-%m-%d')]" || exit 0
          git push
